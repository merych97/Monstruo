<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi ilustración en realidad aumentada</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body {margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
    a-scene {position:fixed!important;inset:0;width:100vw!important;height:100dvh!important}
    #start {position:fixed;z-index:20;inset:0;background:#111e;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px}
    button {border:0;border-radius:999px;background:#fff;color:#111;padding:14px 24px;font-size:17px;font-weight:700;cursor:pointer}
    #restart {position:fixed;z-index:15;top:12px;right:12px;padding:10px 14px;font-size:14px;display:none}
    #hint {position:fixed;z-index:10;bottom:24px;left:12px;right:12px;text-align:center;color:white;text-shadow:0 1px 4px black;pointer-events:none}
  </style>
</head>
<body>
  <div id="start"><h1>Ilustración en movimiento</h1><p>Permite el acceso a la cámara y apunta a la ilustración impresa.</p><button id="go">Iniciar experiencia</button><p id="error" role="alert"></p></div>
  <button id="restart" type="button">Reiniciar cámara</button>
  <div id="hint">Apunta la cámara hacia la ilustración</div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets><video id="video" src="./animacion.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video src="#video" position="0 0 0" width="1" height="0.5625"></a-video>
    </a-entity>
  </a-scene>
  <script>
    const scene = document.querySelector('a-scene');
    const target = document.getElementById('target');
    const video = document.getElementById('video');
    const start = document.getElementById('start');
    const error = document.getElementById('error');
    const hint = document.getElementById('hint');
    const restartButton = document.getElementById('restart');
    const ar = () => scene.systems['mindar-image-system'];
    let active = false;
    let busy = false;
    let startedOnce = false;

    async function stopAR() {
      video.pause();
      if (active) {
        await ar().stop();
        active = false;
      }
    }

    async function startAR() {
      if (busy) return;
      busy = true;
      error.textContent = '';
      try {
        video.muted = true;
        // El primer toque permite reproducir el vídeo en iOS y Android.
        if (!startedOnce) {
          await video.play();
          video.pause();
          video.currentTime = 0;
          startedOnce = true;
        }
        await stopAR();
        // Deja que el navegador termine de aplicar las nuevas dimensiones.
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const width = window.innerWidth;
        const height = window.innerHeight;
        scene.renderer?.setSize(width, height);
        scene.camera && (scene.camera.aspect = width / height, scene.camera.updateProjectionMatrix());
        await ar().start();
        active = true;
        start.style.display = 'none';
        restartButton.style.display = 'block';
        hint.textContent = 'Apunta la cámara hacia la ilustración';
      } catch (e) {
        start.style.display = 'flex';
        restartButton.style.display = 'none';
        error.textContent = 'No se pudo iniciar la cámara: ' + (e.message || String(e));
      } finally { busy = false; }
    }

    document.getElementById('go').addEventListener('click', startAR);
    restartButton.addEventListener('click', async () => {
      if (busy) return;
      busy = true;
      try { await stopAR(); } catch (e) { console.warn(e); }
      busy = false;
      start.style.display = 'flex';
      restartButton.style.display = 'none';
      document.getElementById('go').textContent = 'Reanudar cámara';
    });
    target.addEventListener('targetFound', async () => {
      hint.textContent = '¡Ilustración detectada!';
      try { await video.play(); } catch (e) { hint.textContent = 'Toca la pantalla para reproducir'; }
    });
    target.addEventListener('targetLost', () => {
      video.pause();
      hint.textContent = 'Apunta la cámara hacia la ilustración';
    });
    document.body.addEventListener('click', () => {
      if (active && video.paused) video.play().catch(() => {});
    });

    // Evitar recargar automáticamente la página durante un giro.
    // Se solicita una reanudación manual para preservar el permiso de cámara.
    let orientation = window.innerWidth > window.innerHeight ? 'horizontal' : 'vertical';
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(async () => {
        const next = window.innerWidth > window.innerHeight ? 'horizontal' : 'vertical';
        if (next === orientation) return;
        orientation = next;
        if (!active || busy) return;
        busy = true;
        try { await stopAR(); } catch (e) { console.warn('Error al detener cámara', e); }
        busy = false;
        restartButton.style.display = 'none';
        start.style.display = 'flex';
        document.getElementById('go').textContent = 'Reanudar cámara';
        hint.textContent = 'Pulsa Reanudar cámara tras girar el móvil';
      }, 400);
    });
  </script>
</body>
</html>
